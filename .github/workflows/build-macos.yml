name: Build OBS 17Live Plugin - macOS

on:
  push:
    tags:
      - 'v*.*.*'        # Production builds (e.g., v1.0.0)
      - 'v*.*.*-stage'   # Stage builds (e.g., v1.0.0-stage)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for manual builds (e.g., 1.0.0)'
        required: false
        default: '0.0.0'
        type: string
      architecture:
        description: 'Target architecture'
        required: false
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apple-silicon'
          - 'intel'

env:
  CMAKE_MINIMUM_VERSION: '3.28'
  NODE_VERSION: '20'

jobs:
  # macOS Apple Silicon build
  build-macos-apple-silicon:
    if: ${{ github.event.inputs.architecture == 'both' || github.event.inputs.architecture == 'apple-silicon' || github.event.inputs.architecture == '' }}
    runs-on: macos-14  # Apple Silicon runner
    environment: ${{ contains(github.ref, '-stage') && 'stage' || 'production' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Debug Environment Variables
        run: |
          echo "Current environment: ${BUILD_ENV:-stage}"
          echo "ONESEVENLIVE_API_URL: $ONESEVENLIVE_API_URL"
          echo "BUILD_ENV: ${BUILD_ENV:-stage}"
          echo "VERSION: ${VERSION:-0.0.0}"
        env:
          ONESEVENLIVE_API_URL: ${{ secrets.ONESEVENLIVE_API_URL }}
          BUILD_ENV: ${{ vars.BUILD_ENV }}
          VERSION: ${{ github.event.inputs.version || '0.0.0' }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'web/ably_chat/package-lock.json'
      
      - name: Install Dependencies
        run: |
          # Install CMake (version 3.28 or higher)
          brew install cmake
          cmake_version=$(cmake --version | head -n1 | cut -d' ' -f3)
          echo "Installed CMake version: $cmake_version"
          if ! cmake --version | head -n1 | awk '{print $3}' | awk -F. '{if($1>3 || ($1==3 && $2>=28)) exit 0; else exit 1}'; then
            echo "Error: CMake version must be 3.28 or higher"
            exit 1
          fi
      
      - name: Install and Build Web Components
        run: |
          cd web/ably_chat
          npm ci
          npm run build
      
      - name: Set Environment and Version
        run: |
          # Extract version from tag or use input/default
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version || '0.0.0' }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"
      
      - name: CMake Configure
        run: |
          cmake --preset macos \
            -DONESEVENLIVE_API_URL="$ONESEVENLIVE_API_URL" \
            -DCMAKE_PROJECT_VERSION="$VERSION"
        env:
          ONESEVENLIVE_API_URL: ${{ secrets.ONESEVENLIVE_API_URL }}
      
      - name: Build Project
        run: |
          cmake --build --preset macos --config Release
      
      - name: Import Signing Certificate
        if: ${{ secrets.MACOS_CERTIFICATE_BASE64 && secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "Importing signing certificate..."
          echo $MACOS_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      
      - name: Create Package
        run: |
          PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}.pkg"
          
          # Create unsigned package first
          sudo pkgbuild --root build_macos/Release \
                        --identifier com.17live.obsplugin \
                        --version "$VERSION" \
                        --install-location "/Applications/OBS.app/Contents/PlugIns" \
                        --scripts package/macOS/misc \
                        "$PKG_NAME"
          
          # Sign package if certificate is available
          if [[ -n "$MACOS_CERTIFICATE_BASE64" && -n "$DEVELOPER_ID_INSTALLER" ]]; then
            echo "Signing package..."
            SIGNED_PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}-signed.pkg"
            productsign --sign "$DEVELOPER_ID_INSTALLER" "$PKG_NAME" "$SIGNED_PKG_NAME"
            mv "$SIGNED_PKG_NAME" "$PKG_NAME"
          else
            echo "No signing certificate provided, package will be unsigned"
          fi
          
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon-package
          path: "17liveOBSPlugin-macAppleSilicon-v*.pkg"
          retention-days: 30

  # macOS Intel build
  build-macos-intel:
    if: ${{ github.event.inputs.architecture == 'both' || github.event.inputs.architecture == 'intel' || github.event.inputs.architecture == '' }}
    runs-on: macos-13  # Intel runner
    environment: ${{ contains(github.ref, '-stage') && 'stage' || 'production' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Debug Environment Variables
        run: |
          echo "Current environment: ${BUILD_ENV:-stage}"
          echo "ONESEVENLIVE_API_URL: $ONESEVENLIVE_API_URL"
          echo "BUILD_ENV: ${BUILD_ENV:-stage}"
          echo "VERSION: ${VERSION:-0.0.0}"
        env:
          ONESEVENLIVE_API_URL: ${{ secrets.ONESEVENLIVE_API_URL }}
          BUILD_ENV: ${{ vars.BUILD_ENV }}
          VERSION: ${{ github.event.inputs.version || '0.0.0' }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'web/ably_chat/package-lock.json'
      
      - name: Install Dependencies
        run: |
          # Install CMake (version 3.28 or higher)
          brew install cmake
          cmake_version=$(cmake --version | head -n1 | cut -d' ' -f3)
          echo "Installed CMake version: $cmake_version"
          if ! cmake --version | head -n1 | awk '{print $3}' | awk -F. '{if($1>3 || ($1==3 && $2>=28)) exit 0; else exit 1}'; then
            echo "Error: CMake version must be 3.28 or higher"
            exit 1
          fi
      
      - name: Install and Build Web Components
        run: |
          cd web/ably_chat
          npm ci
          npm run build
      
      - name: Set Environment and Version
        run: |
          # Extract version from tag or use input/default
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version || '0.0.0' }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"
      
      - name: Run macOS Intel Build Script
        run: |
          # Set environment variables for the build script
          export VERSION="$VERSION"
          export ONESEVENLIVE_API_URL="$ONESEVENLIVE_API_URL"
          export CREATE_PACKAGE="true"
          
          # Run the Intel build script
          ./scripts/build-macos-intel.sh
        env:
          ONESEVENLIVE_API_URL: ${{ secrets.ONESEVENLIVE_API_URL }}
          CODESIGN_IDENT: ${{ secrets.CODESIGN_IDENT }}
          CODESIGN_TEAM: ${{ secrets.CODESIGN_TEAM }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-package
          path: "17liveOBSPlugin-macIntel-v*.pkg"
          retention-days: 30

  # Create release if this is a tag build
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos-apple-silicon, build-macos-intel]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-apple-silicon-package/*.pkg
            artifacts/macos-intel-package/*.pkg
          draft: false
          prerelease: ${{ contains(github.ref, '-stage') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}