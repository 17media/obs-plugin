name: Build OBS 17Live Plugin - macOS Apple Silicon

# on:
#   push:
#     tags:
#       - 'v*.*.*'
#       - 'v*.*.*.*'
#       - 'v*.*.*-stage'
#       - 'v*.*.*.*-stage'
#   workflow_dispatch:
#     inputs:
#       environment:
#         description: "Build environment"
#         required: true
#         default: stage
#         type: choice
#         options:
#           - stage
#           - production
#       version:
#         description: "Version number (e.g., 1.0.0 or 1.1.4.1)"
#         required: false
#         default: "0.0.0"
#         type: string
#       enable_youtube:
#         description: "Enable YouTube support"
#         required: false
#         default: false
#         type: boolean
  
jobs:
  build-mac-arm64:
    uses: ./.github/workflows/build-macos-reusable.yml
    with:
      arch_name: "macAppleSilicon"
      cmake_arch: ""
      artifact_name: "macOS-AppleSilicon-PKG"
      use_sudo: false
      environment: ${{ github.event_name == 'push' && (contains(github.ref_name, '-stage') && 'stage' || 'production') || github.event.inputs.environment || 'stage' }}
      version: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && github.ref_name || github.event.inputs.version || '0.0.0' }}
      enable_youtube: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.enable_youtube == 'true') || (github.event_name != 'workflow_dispatch' && vars.ENABLE_YOUTUBE == 'true') }}

  
