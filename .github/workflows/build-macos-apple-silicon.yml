name: Build OBS 17Live Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Build environment"
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production
  
jobs:
  build-mac-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    env:
      ONESEVENLIVE_API_URL: ${{ vars.ONESEVENLIVE_API_URL }}
      VERSION: ${{ github.ref_name || github.event.inputs.version || '0.0.0' }}
      BUILD_ENV: ${{ github.event.inputs.environment || 'stage' }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug Environment Variables
        run: |
          echo "Current environment: ${{ github.event.inputs.environment || 'stage' }}"
          echo "ONESEVENLIVE_API_URL: $ONESEVENLIVE_API_URL"
          echo "BUILD_ENV: $BUILD_ENV"
          echo "VERSION: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Web
        working-directory: web/ably_chat
        run: |
          npm install
          npm run build

      - name: Set ENV and Version
        run: |
          VERSION=${GITHUB_REF##*/}      # 从 tag 取版本
          VERSION=${VERSION#v}           # 去掉 v
          echo "VERSION=$VERSION" >> $GITHUB_ENV

            # 设置包名后缀
            if [ "$BUILD_ENV" == "production" ]; then
              echo "PKG_SUFFIX=" >> $GITHUB_ENV
            else
              echo "PKG_SUFFIX=-stage" >> $GITHUB_ENV
            fi

      - name: CMake Configure
        run: |
          cmake --preset macos \
            -DONESEVENLIVE_API_URL="$ONESEVENLIVE_API_URL" \
            -DCMAKE_PROJECT_VERSION="$VERSION"

      - name: Build
        run: cmake --build --preset macos --config Release

      - name: Create pkg
        run: |
          PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}${PKG_SUFFIX}.pkg"
          sudo pkgbuild --root build_macos/Release \
                        --identifier com.17live.obsplugin \
                        --version "$VERSION" \
                        --install-location "/Applications/OBS.app/Contents/PlugIns" \
                        --scripts package/macOS/misc \
                        "$PKG_NAME"
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: macOS-AppleSilicon-PKG
          path: ${{ env.PKG_NAME }}

  