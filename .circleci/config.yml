version: 2.1

# Import orbs for different platforms
orbs:
  macos: circleci/macos@2.4.1
  win: circleci/windows@5.0

# Include job definitions from separate files
jobs:
  # macOS Apple Silicon build job
  build-macos-apple-silicon:
    macos:
      xcode: 15.0.0
    resource_class: macos.m1.medium.gen1
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - checkout
      
      # Debug environment variables
      - run:
          name: Debug Environment Variables
          command: |
            echo "Current environment: ${BUILD_ENV:-stage}"
            echo "ONESEVENLIVE_API_URL: $ONESEVENLIVE_API_URL"
            echo "BUILD_ENV: ${BUILD_ENV:-stage}"
            echo "VERSION: ${VERSION:-0.0.0}"
      
      # Install dependencies
      - run:
          name: Install Dependencies
          command: |
            # Install Node.js
            brew install node@20
            echo 'export PATH="/opt/homebrew/opt/node@20/bin:$PATH"' >> ~/.bash_profile
            source ~/.bash_profile
            
            # Install CMake if not available
            brew install cmake
      
      # Setup Node.js and build web components
      - run:
          name: Install and Build Web Components
          command: |
            cd web/ably_chat
            npm install
            npm run build
      
      # Set environment variables and version
      - run:
          name: Set Environment and Version
          command: |
            # Extract version from tag or use default
            if [ -n "$CIRCLE_TAG" ]; then
              VERSION=${CIRCLE_TAG#v}
            else
              VERSION=${VERSION:-0.0.0}
            fi
            echo "export VERSION=$VERSION" >> $BASH_ENV
      
      # Configure CMake
      - run:
          name: CMake Configure
          command: |
            source $BASH_ENV
            cmake --preset macos \
              -DONESEVENLIVE_API_URL="$ONESEVENLIVE_API_URL" \
              -DCMAKE_PROJECT_VERSION="$VERSION"
      
      # Build the project
      - run:
          name: Build Project
          command: |
            cmake --build --preset macos --config Release
      
      # Import signing certificate if available
      - run:
          name: Import Signing Certificate
          command: |
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ]; then
              echo "Importing signing certificate..."
              echo $MACOS_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
              security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
              security default-keychain -s build.keychain
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
              security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
              rm certificate.p12
            else
              echo "No signing certificate provided, skipping code signing"
            fi
      
      # Create and sign package
      - run:
          name: Create Package
          command: |
            source $BASH_ENV
            PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}.pkg"
            
            # Create unsigned package first
            sudo pkgbuild --root build_macos/Release \
                          --identifier com.17live.obsplugin \
                          --version "$VERSION" \
                          --install-location "/Applications/OBS.app/Contents/PlugIns" \
                          --scripts package/macOS/misc \
                          "$PKG_NAME"
            
            # Sign package if certificate is available
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$DEVELOPER_ID_INSTALLER" ]; then
              echo "Signing package..."
              SIGNED_PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}-signed.pkg"
              productsign --sign "$DEVELOPER_ID_INSTALLER" "$PKG_NAME" "$SIGNED_PKG_NAME"
              mv "$SIGNED_PKG_NAME" "$PKG_NAME"
            else
              echo "No signing certificate provided, package will be unsigned"
            fi
            
            echo "export PKG_NAME=$PKG_NAME" >> $BASH_ENV
      
      # Store artifacts
      - store_artifacts:
          path: ~/project
          destination: packages
      
      # Persist package for potential deployment
       - persist_to_workspace:
           root: ~/project
           paths:
             - "*.pkg"

  # macOS Intel build job
  build-macos-intel:
    macos:
      xcode: 15.0.0
    resource_class: macos.x86.medium.gen2
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - checkout
      
      # Debug environment variables
      - run:
          name: Debug Environment Variables
          command: |
            echo "Current environment: ${BUILD_ENV:-stage}"
            echo "ONESEVENLIVE_API_URL: $ONESEVENLIVE_API_URL"
            echo "BUILD_ENV: ${BUILD_ENV:-stage}"
            echo "VERSION: ${VERSION:-0.0.0}"
      
      # Install dependencies
      - run:
          name: Install Dependencies
          command: |
            # Install Node.js
            brew install node@20
            echo 'export PATH="/usr/local/opt/node@20/bin:$PATH"' >> ~/.bash_profile
            source ~/.bash_profile
            
            # Install CMake if not available
            brew install cmake
      
      # Setup Node.js and build web components
      - run:
          name: Install and Build Web Components
          command: |
            cd web/ably_chat
            npm install
            npm run build
      
      # Set environment variables and version
      - run:
          name: Set Environment and Version
          command: |
            # Extract version from tag or use default
            if [ -n "$CIRCLE_TAG" ]; then
              VERSION=${CIRCLE_TAG#v}
            else
              VERSION=${VERSION:-0.0.0}
            fi
            echo "export VERSION=$VERSION" >> $BASH_ENV
      
      # Configure CMake
      - run:
          name: CMake Configure
          command: |
            source $BASH_ENV
            cmake --preset macos \
              -DONESEVENLIVE_API_URL="$ONESEVENLIVE_API_URL" \
              -DCMAKE_PROJECT_VERSION="$VERSION"
      
      # Build the project
      - run:
          name: Build Project
          command: |
            cmake --build --preset macos --config Release
      
      # Import signing certificate if available
      - run:
          name: Import Signing Certificate
          command: |
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ]; then
              echo "Importing signing certificate..."
              echo $MACOS_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
              security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
              security default-keychain -s build.keychain
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
              security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
              rm certificate.p12
            else
              echo "No signing certificate provided, skipping code signing"
            fi
      
      # Create and sign package
      - run:
          name: Create Package
          command: |
            source $BASH_ENV
            PKG_NAME="17liveOBSPlugin-macIntel-v${VERSION}.pkg"
            
            # Create unsigned package first
            sudo pkgbuild --root build_macos/Release \
                          --identifier com.17live.obsplugin \
                          --version "$VERSION" \
                          --install-location "/Applications/OBS.app/Contents/PlugIns" \
                          --scripts package/macOS/misc \
                          "$PKG_NAME"
            
            # Sign package if certificate is available
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$DEVELOPER_ID_INSTALLER" ]; then
              echo "Signing package..."
              SIGNED_PKG_NAME="17liveOBSPlugin-macIntel-v${VERSION}-signed.pkg"
              productsign --sign "$DEVELOPER_ID_INSTALLER" "$PKG_NAME" "$SIGNED_PKG_NAME"
              mv "$SIGNED_PKG_NAME" "$PKG_NAME"
            else
              echo "No signing certificate provided, package will be unsigned"
            fi
            
            echo "export PKG_NAME=$PKG_NAME" >> $BASH_ENV
      
      # Store artifacts
      - store_artifacts:
          path: ~/project
          destination: packages
      
      # Persist package for potential deployment
      - persist_to_workspace:
          root: ~/project
          paths:
            - "*.pkg"

  # Windows x64 build job
  build-windows-x64:
    executor:
      name: win/default
      size: large
    steps:
      - checkout
      
      # Debug environment variables
      - run:
          name: Debug Environment Variables
          command: |
            Write-Host "Current environment: $env:BUILD_ENV"
            Write-Host "ONESEVENLIVE_API_URL: $env:ONESEVENLIVE_API_URL"
            Write-Host "BUILD_ENV: $env:BUILD_ENV"
            Write-Host "VERSION: $env:VERSION"
      
      # Install dependencies
      - run:
          name: Install Dependencies
          command: |
            # Install Node.js
            choco install nodejs --version=20.11.0 -y
            
            # Install CMake
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
            
            # Install NSIS
            choco install nsis -y
            
            # Install Visual Studio Build Tools
            choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --locale en-US" -y
            
            # Refresh environment
            refreshenv
      
      # Setup Node.js and build web components
      - run:
          name: Install and Build Web Components
          command: |
            cd web/ably_chat
            npm install
            npm run build
      
      # Set environment variables and version
      - run:
          name: Set Environment and Version
          command: |
            # Extract version from tag or use default
            if ($env:CIRCLE_TAG) {
              $version = $env:CIRCLE_TAG -replace '^v', ''
            } else {
              $version = if ($env:VERSION) { $env:VERSION } else { '0.0.0' }
            }
            
            # Set environment variables for subsequent steps
            echo "VERSION=$version" | Out-File -FilePath $env:BASH_ENV -Encoding utf8 -Append
      
      # Configure CMake
      - run:
          name: CMake Configure
          command: |
            cmake --preset windows-x64 `
              -DONESEVENLIVE_API_URL="$env:ONESEVENLIVE_API_URL" `
              -DCMAKE_PROJECT_VERSION="$env:VERSION"
      
      # Build the project
      - run:
          name: Build Project
          command: |
            cmake --build --preset windows-x64 --config Release
      
      # Import signing certificate if available
      - run:
          name: Import Signing Certificate
          command: |
            if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
              Write-Host "Importing signing certificate..."
              $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
              [System.IO.File]::WriteAllBytes("certificate.pfx", $certBytes)
              
              # Import certificate to store
              $cert = Import-PfxCertificate -FilePath "certificate.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
              Write-Host "Certificate imported: $($cert.Thumbprint)"
              
              Remove-Item "certificate.pfx"
            } else {
              Write-Host "No signing certificate provided, skipping code signing"
            }
      
      # Create NSIS installer script
      - run:
          name: Create NSIS Installer Script
          command: |
            $version = $env:VERSION
            $installerName = "17liveOBSPlugin-Windows-x64-v$version.exe"
            
            $nsisScript = @"
            !define PRODUCT_NAME "17Live OBS Plugin"
            !define PRODUCT_VERSION "$version"
            !define PRODUCT_PUBLISHER "17Live"
            !define PRODUCT_WEB_SITE "https://17.live"
            !define PRODUCT_DIR_REGKEY "Software\Microsoft\Windows\CurrentVersion\App Paths\obs-17live-plugin"
            !define PRODUCT_UNINST_KEY "Software\Microsoft\Windows\CurrentVersion\Uninstall\17LiveOBSPlugin"
            !define PRODUCT_UNINST_ROOT_KEY "HKLM"
            
            SetCompressor lzma
            
            Name "17Live OBS Plugin"
            OutFile "$installerName"
            InstallDir "C:\Program Files\obs-studio\obs-plugins\64bit"
            InstallDirRegKey HKLM "Software\17Live\OBSPlugin" "InstallPath"
            ShowInstDetails show
            ShowUnInstDetails show
            
            Section "MainSection" SEC01
              SetOutPath "\$INSTDIR"
              SetOverwrite ifnewer
              File /r "build_windows_x64\Release\*"
              CreateDirectory "\$SMPROGRAMS\17Live OBS Plugin"
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "InstallPath" "\$INSTDIR"
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "Version" "$version"
            SectionEnd
            
            Section -AdditionalIcons
              WriteIniStr "\$INSTDIR\17live.url" "InternetShortcut" "URL" "\$\{PRODUCT_WEB_SITE}"
              CreateShortCut "\$SMPROGRAMS\17Live OBS Plugin\Website.lnk" "\$INSTDIR\17live.url"
              CreateShortCut "\$SMPROGRAMS\17Live OBS Plugin\Uninstall.lnk" "\$INSTDIR\uninst.exe"
            SectionEnd
            
            Section -Post
              WriteUninstaller "\$INSTDIR\uninst.exe"
              WriteRegStr HKLM "\$\{PRODUCT_DIR_REGKEY}" "" "\$INSTDIR\obs-17live-plugin.exe"
              WriteRegStr \$\{PRODUCT_UNINST_ROOT_KEY} "\$\{PRODUCT_UNINST_KEY}" "DisplayName" "\$\{PRODUCT_NAME}"
              WriteRegStr \$\{PRODUCT_UNINST_ROOT_KEY} "\$\{PRODUCT_UNINST_KEY}" "UninstallString" "\$INSTDIR\uninst.exe"
              WriteRegStr \$\{PRODUCT_UNINST_ROOT_KEY} "\$\{PRODUCT_UNINST_KEY}" "DisplayVersion" "\$\{PRODUCT_VERSION}"
              WriteRegStr \$\{PRODUCT_UNINST_ROOT_KEY} "\$\{PRODUCT_UNINST_KEY}" "URLInfoAbout" "\$\{PRODUCT_WEB_SITE}"
              WriteRegStr \$\{PRODUCT_UNINST_ROOT_KEY} "\$\{PRODUCT_UNINST_KEY}" "Publisher" "\$\{PRODUCT_PUBLISHER}"
            SectionEnd
            
            Section Uninstall
              Delete "\$INSTDIR\17live.url"
              Delete "\$INSTDIR\uninst.exe"
              Delete "\$SMPROGRAMS\17Live OBS Plugin\Uninstall.lnk"
              Delete "\$SMPROGRAMS\17Live OBS Plugin\Website.lnk"
              RMDir "\$SMPROGRAMS\17Live OBS Plugin"
              RMDir /r "\$INSTDIR"
              DeleteRegKey \$\{PRODUCT_UNINST_ROOT_KEY} "\$\{PRODUCT_UNINST_KEY}"
              DeleteRegKey HKLM "\$\{PRODUCT_DIR_REGKEY}"
              DeleteRegKey HKLM "Software\17Live\OBSPlugin"
              SetAutoClose true
            SectionEnd
"@
            
            $nsisScript | Out-File -FilePath "installer.nsi" -Encoding utf8
            echo "INSTALLER_NAME=$installerName" | Out-File -FilePath $env:BASH_ENV -Encoding utf8 -Append
      
      # Build NSIS installer
      - run:
          name: Build NSIS Installer
          command: |
            makensis installer.nsi
      
      # Sign installer if certificate is available
      - run:
          name: Sign Installer
          command: |
            if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
              Write-Host "Signing installer..."
              $installerName = $env:INSTALLER_NAME
              
              # Use signtool to sign the installer
              $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
              
              & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /fd SHA256 /tr $timestampUrl /td SHA256 /a $installerName
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Installer signed successfully"
              } else {
                Write-Host "Failed to sign installer, but continuing..."
              }
            } else {
              Write-Host "No signing certificate provided, installer will be unsigned"
            }
      
      # Store artifacts
      - store_artifacts:
          path: .
          destination: packages
      
      # Persist installer for potential deployment
      - persist_to_workspace:
          root: .
          paths:
            - "*.exe"

workflows:
  version: 2
  
  # Production build workflow - triggered by tags like v1.0.0
  build-production:
    jobs:
      - build-macos-apple-silicon:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          context:
            - macos-signing
            - build-obsplugin-env-prod
      - build-macos-intel:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          context:
            - macos-signing
            - build-obsplugin-env-prod
      - build-windows-x64:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          context:
            - windows-signing
            - build-obsplugin-env-prod
  
  # Stage build workflow - triggered by tags like v1.0.0-stage
  build-stage:
    jobs:
      - build-macos-apple-silicon:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+-stage$/
            branches:
              ignore: /.*/
          context:
            - macos-signing
            - build-obsplugin-env-stag
      - build-macos-intel:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+-stage$/
            branches:
              ignore: /.*/
          context:
            - macos-signing
            - build-obsplugin-env-stag
      - build-windows-x64:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+-stage$/
            branches:
              ignore: /.*/
          context:
            - windows-signing
            - build-obsplugin-env-stag
  
  # Manual build workflow for testing
  manual-build:
    jobs:
      - hold:
          type: approval
      - build-macos-apple-silicon:
          requires:
            - hold
          context:
            - macos-signing
            - build-obsplugin-env-stag
      - build-macos-intel:
          requires:
            - hold
          context:
            - macos-signing
            - build-obsplugin-env-stag
      - build-windows-x64:
          requires:
            - hold
          context:
            - windows-signing
            - build-obsplugin-env-stag