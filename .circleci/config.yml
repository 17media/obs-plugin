version: 2.1

# Pipeline parameters
parameters:
  version:
    type: string
    default: "0.0.0"
    description: "Version number for manual builds (e.g., 1.0.0)"

# Import orbs for different platforms
orbs:
  macos: circleci/macos@2.4.1
  win: circleci/windows@5.0

# Include job definitions from separate files
jobs:
  # macOS Apple Silicon build job
  build-macos-apple-silicon:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      VERSION: << pipeline.parameters.version >>
    steps:
      - checkout
      
      # Set environment based on tag
      - run:
          name: Set Environment Variables
          command: |
            # Determine environment based on tag or default to stage
            if [ -n "$CIRCLE_TAG" ]; then
              if [[ "$CIRCLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                # Production tag (e.g., v1.0.0)
                export BUILD_ENV="prod"
                export ONESEVENLIVE_API_URL="$PROD_ONESEVENLIVE_API_URL"
              elif [[ "$CIRCLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stage$ ]]; then
                # Stage tag (e.g., v1.0.0-stage)
                export BUILD_ENV="stage"
                export ONESEVENLIVE_API_URL="$STAGE_ONESEVENLIVE_API_URL"
              else
                # Default to stage for other tags
                export BUILD_ENV="stage"
                export ONESEVENLIVE_API_URL="$STAGE_ONESEVENLIVE_API_URL"
              fi
            else
              # Manual build - default to stage
              export BUILD_ENV="stage"
              export ONESEVENLIVE_API_URL="$STAGE_ONESEVENLIVE_API_URL"
            fi
            
            # Save environment variables for subsequent steps
            echo "export BUILD_ENV=$BUILD_ENV" >> $BASH_ENV
            echo "export ONESEVENLIVE_API_URL=$ONESEVENLIVE_API_URL" >> $BASH_ENV
            
            echo "Environment set to: $BUILD_ENV"
            echo "API URL set to: $ONESEVENLIVE_API_URL"
      
      # Debug environment variables
      - run:
          name: Debug Environment Variables
          command: |
            source $BASH_ENV
            echo "Current environment: $BUILD_ENV"
            echo "ONESEVENLIVE_API_URL: $ONESEVENLIVE_API_URL"
            echo "VERSION: ${VERSION:-0.0.0}"
      
      # Install dependencies
      - run:
          name: Install Dependencies
          command: |
            # Install Node.js
            brew install node@20
            echo 'export PATH="/opt/homebrew/opt/node@20/bin:$PATH"' >> ~/.bash_profile
            source ~/.bash_profile
            
            # Install CMake (version 3.28 or higher)
            brew install cmake
            cmake_version=$(cmake --version | head -n1 | cut -d' ' -f3)
            echo "Installed CMake version: $cmake_version"
            if ! cmake --version | head -n1 | awk '{print $3}' | awk -F. '{if($1>3 || ($1==3 && $2>=28)) exit 0; else exit 1}'; then
              echo "Error: CMake version must be 3.28 or higher"
              exit 1
            fi
      
      # Setup Node.js and build web components
      - run:
          name: Install and Build Web Components
          command: |
            cd web/ably_chat
            npm install
            npm run build
      
      # Set environment variables and version
      - run:
          name: Set Environment and Version
          command: |
            # Extract version from tag or use default
            if [ -n "$CIRCLE_TAG" ]; then
              VERSION=${CIRCLE_TAG#v}
            else
              VERSION=${VERSION:-0.0.0}
            fi
            echo "export VERSION=$VERSION" >> $BASH_ENV
      
      # Configure CMake
      - run:
          name: CMake Configure
          command: |
            source $BASH_ENV
            cmake --preset macos \
              -DONESEVENLIVE_API_URL="$ONESEVENLIVE_API_URL" \
              -DCMAKE_PROJECT_VERSION="$VERSION"
      
      # Build the project
      - run:
          name: Build Project
          command: |
            cmake --build --preset macos --config Release
      
      # Import signing certificate if available
      - run:
          name: Import Signing Certificate
          command: |
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ]; then
              echo "Importing signing certificate..."
              echo $MACOS_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
              security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
              security default-keychain -s build.keychain
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
              security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
              rm certificate.p12
            else
              echo "No signing certificate provided, skipping code signing"
            fi
      
      # Create and sign package
      - run:
          name: Create Package
          command: |
            source $BASH_ENV
            # Add -stage suffix for stage environment
            if [ "$BUILD_ENV" = "stage" ]; then
              PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}-stage.pkg"
            else
              PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}.pkg"
            fi
            
            # Create unsigned package first
            sudo pkgbuild --root build_macos/Release \
                          --identifier com.17live.obsplugin \
                          --version "$VERSION" \
                          --install-location "/Applications/OBS.app/Contents/PlugIns" \
                          --scripts package/macOS/misc \
                          "$PKG_NAME"
            
            # Sign package if certificate is available
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$DEVELOPER_ID_INSTALLER" ]; then
              echo "Signing package..."
              SIGNED_PKG_NAME="17liveOBSPlugin-macAppleSilicon-v${VERSION}-signed.pkg"
              productsign --sign "$DEVELOPER_ID_INSTALLER" "$PKG_NAME" "$SIGNED_PKG_NAME"
              mv "$SIGNED_PKG_NAME" "$PKG_NAME"
            else
              echo "No signing certificate provided, package will be unsigned"
            fi
            
            echo "export PKG_NAME=$PKG_NAME" >> $BASH_ENV
      
      # Store artifacts
      - store_artifacts:
          path: 17liveOBSPlugin-macAppleSilicon-v*.pkg
          destination: packages
      
      # Persist package for potential deployment
      - persist_to_workspace:
          root: .
          paths:
            - "17liveOBSPlugin-macAppleSilicon-v*.pkg"

  # Windows x64 build job
  build-windows-x64:
    executor:
      name: win/default
      size: large
    environment:
      VERSION: << pipeline.parameters.version >>
    steps:
      - checkout
      
      # Set environment based on tag
      - run:
          name: Set Environment Variables
          command: |
            # Determine environment based on tag or default to stage
            if ($env:CIRCLE_TAG) {
              if ($env:CIRCLE_TAG -match '^v\d+\.\d+\.\d+$') {
                # Production tag (e.g., v1.0.0)
                $env:BUILD_ENV = "prod"
                $env:ONESEVENLIVE_API_URL = $env:PROD_ONESEVENLIVE_API_URL
              } elseif ($env:CIRCLE_TAG -match '^v\d+\.\d+\.\d+-stage$') {
                # Stage tag (e.g., v1.0.0-stage)
                $env:BUILD_ENV = "stage"
                $env:ONESEVENLIVE_API_URL = $env:STAGE_ONESEVENLIVE_API_URL
              } else {
                # Default to stage for other tags
                $env:BUILD_ENV = "stage"
                $env:ONESEVENLIVE_API_URL = $env:STAGE_ONESEVENLIVE_API_URL
              }
            } else {
              # Manual build - default to stage
              $env:BUILD_ENV = "stage"
              $env:ONESEVENLIVE_API_URL = $env:STAGE_ONESEVENLIVE_API_URL
            }
            
            # Save environment variables for subsequent steps
            echo "BUILD_ENV=$env:BUILD_ENV" | Out-File -FilePath $env:BASH_ENV -Encoding utf8 -Append
            echo "ONESEVENLIVE_API_URL=$env:ONESEVENLIVE_API_URL" | Out-File -FilePath $env:BASH_ENV -Encoding utf8 -Append
            
            # Also set as machine-level environment variables for PowerShell sessions
            [Environment]::SetEnvironmentVariable("BUILD_ENV", $env:BUILD_ENV, "Machine")
            [Environment]::SetEnvironmentVariable("ONESEVENLIVE_API_URL", $env:ONESEVENLIVE_API_URL, "Machine")
            
            Write-Host "Environment set to: $env:BUILD_ENV"
            Write-Host "API URL set to: $env:ONESEVENLIVE_API_URL"
      
      # Debug environment variables
      - run:
          name: Debug Environment Variables
          command: |
            Write-Host "Current environment: $env:BUILD_ENV"
            Write-Host "ONESEVENLIVE_API_URL: $env:ONESEVENLIVE_API_URL"
            Write-Host "VERSION: $env:VERSION"
      
      # Install dependencies
      - run:
          name: Install Dependencies
          command: |
            # Install Node.js
            choco install nodejs --version=20.11.0 -y
            
            # Install CMake (version 3.28 or higher)
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
            
            # Install NSIS for creating Windows installer
            choco install nsis -y
            
            # Verify CMake version
            refreshenv
            $cmakeVersion = (cmake --version | Select-String -Pattern "cmake version" | ForEach-Object { $_.ToString().Split(' ')[2] })
            Write-Host "Installed CMake version: $cmakeVersion"
            $versionParts = $cmakeVersion.Split('.')
            $major = [int]$versionParts[0]
            $minor = [int]$versionParts[1]
            if ($major -lt 3 -or ($major -eq 3 -and $minor -lt 28)) {
              Write-Error "Error: CMake version must be 3.28 or higher"
              exit 1
            }
            
            # Install NSIS
            choco install nsis -y
            
            # Install Visual Studio Build Tools 2022
            choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --locale en-US" -y
            
            # Refresh environment
            refreshenv
      
      # Setup Node.js and build web components
      - run:
          name: Install and Build Web Components
          command: |
            cd web/ably_chat
            npm install
            npm run build
      
      # Set environment variables and version
      - run:
          name: Set Environment and Version
          command: |
            # Extract version from tag or use default
            if ($env:CIRCLE_TAG) {
              $version = $env:CIRCLE_TAG -replace '^v', ''
            } else {
              $version = if ($env:VERSION) { $env:VERSION } else { '0.0.0' }
            }
            
            # Set environment variables for subsequent steps
            echo "VERSION=$version" | Out-File -FilePath $env:BASH_ENV -Encoding utf8 -Append
            # Also set as machine-level environment variable for PowerShell sessions
            [Environment]::SetEnvironmentVariable("VERSION", $version, "Machine")
            # Set for current session
            $env:VERSION = $version
            Write-Host "Set VERSION to: $version"
      
      # Configure CMake
      - run:
          name: CMake Configure
          command: |
            cmake --preset windows-x64 -DONESEVENLIVE_API_URL="$env:ONESEVENLIVE_API_URL" -DCMAKE_PROJECT_VERSION="$env:VERSION"
      
      # Build the project
      - run:
          name: Build Project
          command: |
            cmake --build --preset windows-x64 --config Release
      
      # Import signing certificate if available
      - run:
          name: Import Signing Certificate
          command: |
            if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
              Write-Host "Importing signing certificate..."
              $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
              [System.IO.File]::WriteAllBytes("certificate.pfx", $certBytes)
              
              # Import certificate to store
              $cert = Import-PfxCertificate -FilePath "certificate.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
              Write-Host "Certificate imported: $($cert.Thumbprint)"
              
              Remove-Item "certificate.pfx"
            } else {
              Write-Host "No signing certificate provided, skipping code signing"
            }
      
      # Create NSIS installer script
      - run:
          name: Create NSIS Installer Script
          shell: powershell
          command: |
            # Debug: Check if VERSION is available
            Write-Host "Current VERSION environment variable: $env:VERSION"
            $version = $env:VERSION
            if (-not $version) {
              Write-Host "VERSION not found in environment, using default 0.0.0"
              $version = "0.0.0"
            }
            Write-Host "Using version: $version"
            # Add -stage suffix for stage environment
            if ($env:BUILD_ENV -eq "stage") {
              $installerName = "17liveOBSPlugin-windows-v$version-stage.exe"
            } else {
              $installerName = "17liveOBSPlugin-windows-v$version.exe"
            }
            Write-Host "Installer name will be: $installerName"
            
            $nsisScript = @"
            !define PRODUCT_NAME "17Live OBS Plugin"
            !define PRODUCT_VERSION "$version"
            !define PRODUCT_PUBLISHER "17Live Limited"
            !define PRODUCT_WEB_SITE "https://17.live"
            !define PACKAGE_ID "OneSevenLive.ObsPlugin"
            !define PACKAGE_NAME "OneSevenLiveOBSPlugin"
            !define UPGRADE_CODE "b81d9705-e5b2-475f-8de8-4d02d297c073"
            !define PRODUCT_DIR_REGKEY "Software\Microsoft\Windows\CurrentVersion\App Paths\obs-17live-plugin"
            !define PRODUCT_UNINST_KEY "Software\Microsoft\Windows\CurrentVersion\Uninstall\17LiveOBSPlugin"
            !define PRODUCT_UNINST_ROOT_KEY "HKLM"
            
            SetCompressor lzma
            
            Name "17Live OBS Plugin"
            OutFile "$installerName"
            InstallDir "C:\Program Files\obs-studio"
            InstallDirRegKey HKLM "Software\OBS Studio" "InstallPath"
            ShowInstDetails show
            ShowUnInstDetails show
            RequestExecutionLevel admin
            
            Page directory
            Page instfiles
            
            UninstPage uninstConfirm
            UninstPage instfiles
            
            Section "MainSection" SEC01
              # Install DLL and PDB files to obs-plugins\64bit
              SetOutPath "`$INSTDIR\obs-plugins\64bit"
              SetOverwrite ifnewer
              File "build_x64\rundir\Release\obs-17live.dll"
              File "build_x64\rundir\Release\obs-17live.pdb"
              
              # Install data directory to data\obs-plugins
              SetOutPath "`$INSTDIR\data\obs-plugins"
              File /r "build_x64\rundir\Release\obs-17live"
              
              # Create start menu shortcuts
              CreateDirectory "`$SMPROGRAMS\17Live OBS Plugin"
              
              # Write registry entries
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "InstallPath" "`$INSTDIR"
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "Version" "$version"
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "PackageId" "${PACKAGE_ID}"
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "PackageName" "${PACKAGE_NAME}"
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "Manufacturer" "${PRODUCT_PUBLISHER}"
              WriteRegStr HKLM "Software\17Live\OBSPlugin" "UpgradeCode" "${UPGRADE_CODE}"
            SectionEnd
            
            Section -AdditionalIcons
              WriteIniStr "`$INSTDIR\17live.url" "InternetShortcut" "URL" "`${PRODUCT_WEB_SITE}"
              CreateShortCut "`$SMPROGRAMS\17Live OBS Plugin\Website.lnk" "`$INSTDIR\17live.url"
              CreateShortCut "`$SMPROGRAMS\17Live OBS Plugin\Uninstall.lnk" "`$INSTDIR\uninst.exe"
            SectionEnd
            
            Section -Post
              WriteUninstaller "`$INSTDIR\uninst.exe"
              WriteRegStr HKLM "`${PRODUCT_DIR_REGKEY}" "" "`$INSTDIR\obs-17live-plugin.exe"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "DisplayName" "`${PRODUCT_NAME}"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "UninstallString" "`$INSTDIR\uninst.exe"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "DisplayVersion" "`${PRODUCT_VERSION}"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "URLInfoAbout" "`${PRODUCT_WEB_SITE}"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "Publisher" "`${PRODUCT_PUBLISHER}"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "PackageId" "`${PACKAGE_ID}"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "PackageName" "`${PACKAGE_NAME}"
              WriteRegStr `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}" "UpgradeCode" "`${UPGRADE_CODE}"
            SectionEnd
            
            Section Uninstall
              # Remove plugin files
              Delete "`$INSTDIR\obs-plugins\64bit\obs-17live.dll"
              Delete "`$INSTDIR\obs-plugins\64bit\obs-17live.pdb"
              RMDir /r "`$INSTDIR\data\obs-plugins\obs-17live"
              
              # Remove shortcuts and registry entries
              Delete "`$INSTDIR\17live.url"
              Delete "`$INSTDIR\uninst.exe"
              Delete "`$SMPROGRAMS\17Live OBS Plugin\Uninstall.lnk"
              Delete "`$SMPROGRAMS\17Live OBS Plugin\Website.lnk"
              RMDir "`$SMPROGRAMS\17Live OBS Plugin"
              
              DeleteRegKey `${PRODUCT_UNINST_ROOT_KEY} "`${PRODUCT_UNINST_KEY}"
              DeleteRegKey HKLM "`${PRODUCT_DIR_REGKEY}"
              DeleteRegKey HKLM "Software\17Live\OBSPlugin"
              
              SetAutoClose true
            SectionEnd
            "@
            
            $nsisScript | Out-File -FilePath "installer.nsi" -Encoding utf8
            echo "INSTALLER_NAME=$installerName" | Out-File -FilePath $env:BASH_ENV -Encoding utf8 -Append
            # Also set as environment variable for current and subsequent sessions
            [Environment]::SetEnvironmentVariable("INSTALLER_NAME", $installerName, "Machine")
            $env:INSTALLER_NAME = $installerName
            Write-Host "Set INSTALLER_NAME to: $installerName"
      
      # Build NSIS installer
      - run:
          name: Build NSIS Installer
          shell: powershell
          command: |
            # Refresh environment to pick up NSIS installation
            refreshenv
            
            # Use full path to makensis or ensure it's in PATH
            if (Get-Command makensis -ErrorAction SilentlyContinue) {
              makensis installer.nsi
            } else {
              # Try common NSIS installation paths
              $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
              if (Test-Path $nsisPath) {
                & $nsisPath installer.nsi
              } else {
                Write-Error "NSIS makensis not found. Please ensure NSIS is properly installed."
                exit 1
              }
            }
      
      # Sign installer if certificate is available
      - run:
          name: Sign Installer
          command: |
            if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
              Write-Host "Signing installer..."
              # Debug: Check installer name
              Write-Host "INSTALLER_NAME from env: $env:INSTALLER_NAME"
              $installerName = $env:INSTALLER_NAME
              
              # Fallback: reconstruct installer name if not available
              if (-not $installerName) {
                $version = if ($env:VERSION) { $env:VERSION } else { "0.0.0" }
                # Add -stage suffix for stage environment
                if ($env:BUILD_ENV -eq "stage") {
                  $installerName = "17liveOBSPlugin-windows-v$version-stage.exe"
                } else {
                  $installerName = "17liveOBSPlugin-windows-v$version.exe"
                }
                Write-Host "Reconstructed installer name: $installerName"
              }
              Write-Host "Using installer name: $installerName"
              
              # Use signtool to sign the installer
              $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
              
              & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /fd SHA256 /tr $timestampUrl /td SHA256 /a $installerName
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Installer signed successfully"
              } else {
                Write-Host "Failed to sign installer, but continuing..."
              }
            } else {
              Write-Host "No signing certificate provided, installer will be unsigned"
            }
      
      # Store artifacts
      - store_artifacts:
          path: 17liveOBSPlugin-windows-v*.exe
          destination: packages
      
      # Persist installer for potential deployment
      - persist_to_workspace:
          root: .
          paths:
            - "17liveOBSPlugin-windows-v*.exe"

workflows:
  version: 2
  
  # Tag-based build workflow - supports both production and stage builds
  tag-build:
    jobs:
      - build-macos-apple-silicon:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-stage)?$/
            branches:
              ignore: /.*/
          context:
            - macos-signing
      - build-windows-x64:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-stage)?$/
            branches:
              ignore: /.*/
          context:
            - windows-signing
  
  # Manual build workflow for testing (defaults to stage environment)
  manual-build:
    jobs:
      - hold:
          type: approval
      - build-macos-apple-silicon:
          requires:
            - hold
          context:
            - macos-signing
      - build-windows-x64:
          requires:
            - hold
          context:
            - windows-signing