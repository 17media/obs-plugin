CustomizedCartoon.Help.Tooltip="說明"
CustomizedCartoon.Help.Button="知道了"
CustomizedCartoon.Help.Content="<h3 style='text-align:center;font-weight:bold;font-size:16px;'>動畫觸發設定</h3><p>此功能可在達成指定條件時，於直播畫面中播放動畫或顯示圖片。</p><p>您可以上傳影片或圖片檔案。單一檔案大小不可超過 200MB，最多可設定 5 個觸發條件。</p><p>若多個條件同時達成，動畫會依設定順序播放。動畫開始播放後不會被中斷，新觸發的動畫會在目前動畫播放完畢後依序播放。</p><p>累計次數僅於目前直播中生效，新的直播開始後將重新計算。</p><p>請確認上傳的素材符合 17LIVE 服務條款及隱私權政策，並擁有使用權。</p><p>更多資訊請參考 <a href='https://17mediahelp.zendesk.com/hc/en-us/articles/31066637227161-OBS%E7%9B%B4%E6%92%AD' style='color: #007AFF'>說明頁面</a>。</p>"
