Live.Settings.GroupCall.Help.Content="<h3 style='text-align:center;font-weight:bold; font-size:16px;'>如何啟用派對直播</h3><p><b>1. 在 OBS 開啟「派對直播」</b></p><p>啟用後，您可以加入或接收派對直播的邀請。</p><p><b>2. 在 17LIVE App 設定派對直播</b></p><p>在 OBS 開始直播後，進入 17LIVE App 的「遙控器」，點擊右上角的按鈕開始派對直播。詳細資訊請參考 <a href='https://17mediahelp.zendesk.com/hc/en-us/articles/38830290086297-Group-Call' style='color: #007AFF'>常見問題</a>。</p><p><b>3. 避免回音問題</b></p><p>為避免回音，請使用耳機收聽遙控器上的派對直播語音，或將遙控器遠離電腦麥克風。您也可以在對方說話時，在 OBS 中將麥克風靜音。</p>"
