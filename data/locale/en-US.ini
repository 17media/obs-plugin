Live.Settings.PartyLive.Help.Tooltip="Click to view Party Live instructions"
Live.Settings.PartyLive.Help.Title="How to Enable Party Live"
Live.Settings.PartyLive.Help.Content="<h3>How to Enable Party Live</h3><p><b>1. Enable Party Live setting on 17.live streaming setup page</b></p><p>Only after enabling this setting and generating a stream key will you have the opportunity to join or receive party invitations.</p><br><p><b>2. Set up 'WHIP Service' in OBS</b></p><p>After pasting the key into OBS, please ensure that the service item in OBS (Settings>Stream>Service) is set to WHIP for smooth streaming.</p><br><p><b>3. Start Party Live in 17LIVE App after streaming</b></p><p>After starting the stream in OBS, use your phone to open the 17LIVE App, enter the streaming room, go to 'Broadcaster Remote Control', and click the party button in the upper right corner to start Party Live. For more details, visit <a href='#'>FAQ</a>.</p><br><p><b>4. Avoid echo issues</b></p><p>To prevent the broadcaster controller's sound from being picked up by the computer microphone and causing echo, please use headphones to listen to party content, or maintain distance between the broadcaster controller and computer microphone. You can also mute the computer microphone in OBS when others are speaking.</p>"
Live.Settings.PartyLive.Help.Button="OK"
