Live.Settings.GroupCall.Help.Content="<h3 style='text-align:center;font-weight:bold; font-size:16px;'>如何启用派对直播</h3><p><b>1. 在 OBS 开启「派对直播」</b></p><p>启用后，您可以加入或接收派对直播的邀请。</p><p><b>2. 在 17LIVE App 设定派对直播</b></p><p>在 OBS 开始直播后，进入 17LIVE App 的「遥控器」，点击右上角的按钮开始派对直播。详细信息请参考 <a href='https://17mediahelp.zendesk.com/hc/en-us/articles/38830290086297-Group-Call' style='color: #007AFF'>常见问题</a>。</p><p><b>3. 避免回音问题</b></p><p>为避免回音，请使用耳机收听遥控器上的派对直播语音，或将遥控器远离电脑麦克风。您也可以在对方说话时，在 OBS 中将麦克风静音。</p>"
