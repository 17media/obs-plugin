<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>17Live 聊天室</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            background-color: #2c2c2c;
            padding: 10px;
            text-align: left;
            font-weight: bold;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .message {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .user-id {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 5px;
            margin-right: 10px;
            color: white;
            font-weight: bold;
        }
        
        .user-name {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .user-19 { background-color: #4CAF50; }
        .user-9 { background-color: #2196F3; }
        .user-18 { background-color: #FFC107; }
        
        .input-container {
            display: flex;
            padding: 10px;
            background-color: #2c2c2c;
        }
        
        .input-field {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background-color: #3c3c3c;
            color: white;
            margin-right: 10px;
        }
        
        .send-button {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <!-- 聊天消息将在这里动态添加 -->
    </div>
    
    <div class="input-container">
        <input type="text" class="input-field" id="messageInput" placeholder="Chat...">
        <button class="send-button" id="sendButton">➤</button>
    </div>
    
    <script>
        // 示例消息数据
        const messages = [
            { id: 19, name: 'snuggle2', message: 'sent 10 snacks' },
            { id: 9, name: 'Brian', message: '@abelteng hi' },
            { id: 18, name: 'abelteng', message: 'hello world' }
        ];
        
        // 显示消息
        function displayMessages() {
            const chatContainer = document.getElementById('chatContainer');
            
            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                
                const userIdSpan = document.createElement('span');
                userIdSpan.className = `user-id user-${msg.id}`;
                userIdSpan.textContent = msg.id;
                
                const userNameSpan = document.createElement('span');
                userNameSpan.className = 'user-name';
                userNameSpan.textContent = msg.name;
                
                const messageSpan = document.createElement('span');
                messageSpan.className = 'message-text';
                messageSpan.textContent = msg.message;
                
                messageDiv.appendChild(userIdSpan);
                messageDiv.appendChild(userNameSpan);
                messageDiv.appendChild(messageSpan);
                
                chatContainer.appendChild(messageDiv);
            });
        }
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                const newMessage = {
                    id: 99,
                    name: 'You',
                    message: message
                };
                
                messages.push(newMessage);
                
                // 清空输入框
                input.value = '';
                
                // 清空聊天容器并重新显示所有消息
                document.getElementById('chatContainer').innerHTML = '';
                displayMessages();
                
                // 滚动到底部
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            displayMessages();
            
            // 发送按钮点击事件
            document.getElementById('sendButton').addEventListener('click', sendMessage);
            
            // 输入框回车事件
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
